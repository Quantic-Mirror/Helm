# ── Helm dashboard, containerized ───────────────────────────────────────────────
#
# The Helm server and SearXNG run as containers on the host.
# The password vault (pass + gpg) and audio grabber (yt-dlp) run natively on
# a separate Linux host and are reached over HTTP.
# See CONTAINER_SETUP.md + WSL2_VAULT_SETUP.md for the full dual-boot topology.
#
# Why vault/audio stay on a separate host, not in containers:
# - vault_api.py shells out to `pass` → gpg-agent → your real GPG key.
#   pass + gpg are Linux-only; running vault_server.py on the host (and WSL2
#   on the Windows side) with the pass store on a USB drive is the path.
# - audio_grabber_server.py runs yt-dlp with browser cookies + ~/.local/bin
#   in PATH — easiest to keep on the host where those live.
#
# Music tab: Removed from Helm. MPD runs on the host (native on Linux,
# WSL2 on Windows). Use a native MPD client app instead of a browser iframe.
# See CONTAINER_SETUP.md for details.
#
# All hostnames are configurable via .env variables — no hardcoding.
# Adapt this setup to any host by setting the variables in .env.
#
# ── Where the ports bind (HELM_BIND in .env) ──────────────────────────────────
#
#   HELM_BIND=127.0.0.1  (default)  loopback only — reachable just from this host
#   HELM_BIND=<Tailscale IP>        tailnet-only; pair with a self-signed cert
#                                   (CN = that IP). Recommended for one user.
#   HELM_BIND=0.0.0.0               every interface — only behind a reverse
#                                   proxy + auth (Helm has none built in).
#
# HELM_PORT / SEARXNG_PORT still override the whole "ip:hostport:containerport"
# mapping when you also need a different host port.
#
# To start on a fresh host:
#   git clone <repo> && cd <repo>
#   cp .env.example .env   # then edit — see CONTAINER_SETUP.md
#   docker compose up -d
#
# The code is baked into the image (Dockerfile.helm `COPY . .`). Mutable
# state, TLS certs and tokens live in ./data on the host, bind-mounted to
# /app/state and pointed at via HELM_STATE_DIR — so they survive image
# rebuilds and stay editable from the host.

services:
  # ── The main dashboard server ───────────────────────────────────────────────
  helm:
    build:
      context: .
      dockerfile: Dockerfile.helm
    container_name: helm
    restart: unless-stopped
    # Bind interface comes from HELM_BIND (default 127.0.0.1); see the header.
    # helm_server.py binds ONE port (the `command:` arg) and TLS-wraps it when
    # data/cert.pem + data/key.pem exist — so this is HTTPS on 8443 with a cert,
    # plain HTTP on 8443 without one. There is no separate HTTP port.
    ports:
      - "${HELM_PORT:-${HELM_BIND:-127.0.0.1}:8443:8443}"
    # Run as the host user so systemd --user works for service monitoring.
    # Find yours: id -u && id -g
    user: "${HELM_UID:-1000}:${HELM_GID:-1000}"
    group_add:
      # Add the container process to the host docker group so it can
      # control Docker containers via the socket API.
      # Find yours: getent group docker | cut -d: -f3
      - "${DOCKER_GID:-999}"
    # Host ./data is bind-mounted to /app/state (HELM_STATE_DIR below). It may
    # be empty on first run — marks_state.json and helm-backups/ are created
    # automatically. Drop in as needed:
    #   vault_token.txt       (shared secret, also on the vault host)
    #   audio_token.txt       (shared secret, also on the audio host)
    #   cert.pem + key.pem    (for HTTPS on 8443 — optional)
    volumes:
      - ./data:/app/state
      # Docker socket: lets MONITORED_SERVICES list/control containers
      # (searxng, etc.) via the Docker socket API. Safe to remove if you
      # don't need the Services tab to see other containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # OPTIONAL — only for monitoring the *host's* systemd-user services from
      # the Services/Logs tabs. Requires a running user session + journal on
      # the host (`loginctl enable-linger <user>`), otherwise `docker compose
      # up` fails on the missing socket path. Most containerized deployments
      # have no host systemd-user units to watch — leave these commented and
      # trim the systemd-user entries from MONITORED_SERVICES.
      # - /run/user/${HELM_UID:-1000}/systemd/private:/run/user/${HELM_UID:-1000}/systemd/private:rw
      # - /run/user/${HELM_UID:-1000}/journal/socket:/run/user/${HELM_UID:-1000}/journal/socket:ro
    environment:
      # Mutable state / secrets / certs dir (the ./data bind mount above).
      HELM_STATE_DIR: "/app/state"
      # SERVER_HOST must match the hostname browsers will use to reach this
      # container. The frontend uses it to construct URLs for /api/config.
      # For Tailscale: set to your Tailscale IP (e.g. 100.x.x.x)
      # For public/LAN: set to your domain or LAN IP
      SERVER_HOST: "${SERVER_HOST:-localhost}"
      SERVER_PORT: "8443"
      # API auth: every /api/* route (except /api/health and the token-authed
      # /api/backup-events) requires `Authorization: Bearer <token>` when
      # ./data/helm_token.txt exists. Generate with:
      #   openssl rand -hex 32 > ./data/helm_token.txt
      # Cross-origin API callers must be listed here (comma-separated); the
      # dashboard is same-origin and needs nothing. No wildcard CORS.
      HELM_ALLOWED_ORIGINS: "${HELM_ALLOWED_ORIGINS:-}"
      # vault_server.py (pass + gpg) and audio_grabber_server.py (yt-dlp +
      # cookies) run on the workstation. Copy vault_token.txt / audio_token.txt
      # into ./data so they're readable inside the container.
      #
      # The workstation dual-boots and each OS is its own tailnet node, so list
      # every candidate host in VAULT_HOSTS / AUDIO_HOSTS (comma-separated, no
      # scheme/port) -- helm_server tries each and sticks to whichever answers.
      # VAULT_HOST / AUDIO_HOST stay as the single-host fallback when *_HOSTS
      # is unset.
      VAULT_HOSTS: "${VAULT_HOSTS:-}"
      AUDIO_HOSTS: "${AUDIO_HOSTS:-}"
      VAULT_BACKEND_URL: "http://${VAULT_HOST:-hyperion}:8090"
      AUDIO_BACKEND_URL: "http://${AUDIO_HOST:-hyperion}:8091"
      # SearXNG URL — the frontend fetches this to populate the search engine URL.
      SEARXNG_URL: "http://${SEARXNG_HOST:-localhost}:8081"
      # LeafWiki URL — the frontend fetches this to point the Wiki tab's
      # iframe at the proxy in front of it (see leafwiki-proxy below), same
      # pattern as SEARXNG_URL above. Must be an address the BROWSER can
      # reach, so use SERVER_HOST, not the container-internal "leafwiki"
      # hostname. A fresh port (9004) rather than reusing 9002/9003 from the
      # Memos/TriliumNext/SilverBullet era, so no stale browser-side
      # cookies/cache/service-worker state can carry over to this origin.
      LEAFWIKI_URL: "https://${SERVER_HOST:-localhost}:${LEAFWIKI_PROXY_LISTEN_PORT:-9004}"
    command: ["python3", "helm_server.py", "8443"]

  # ── LeafWiki (self-hosted markdown wiki, iframed into the Wiki tab) ─────────
  # LeafWiki only speaks plain HTTP itself (see leafwiki-proxy below for the
  # TLS termination Helm's HTTPS origin requires to avoid mixed-content
  # blocking). Admin credentials are set deterministically via env vars on
  # first boot — no browser setup wizard, deliberately avoiding the class of
  # bug that broke TriliumNext's password login earlier (see git history).
  # LEAFWIKI_ALLOW_INSECURE=true is required because the container itself
  # only ever sees plain HTTP on leafwiki-proxy's backend leg; leafwiki-proxy
  # (not LeafWiki) is what adds SameSite=None; Secure on the way back out to
  # the browser — see CLAUDE.md "helm_tls_proxy.py cookie-rewriting pattern".
  leafwiki:
    image: ghcr.io/perber/leafwiki:latest
    container_name: leafwiki
    restart: unless-stopped
    environment:
      LEAFWIKI_JWT_SECRET: "${LEAFWIKI_JWT_SECRET:?set a random secret in .env, e.g. openssl rand -hex 32}"
      LEAFWIKI_ADMIN_PASSWORD: "${LEAFWIKI_ADMIN_PASSWORD:?set an initial admin password in .env}"
      LEAFWIKI_ALLOW_INSECURE: "true"
    volumes:
      - ./leafwiki-data:/app/data

  # helm_tls_proxy.py in front of leafwiki: strips X-Frame-Options / rewrites
  # CSP frame-ancestors and Set-Cookie SameSite/Secure so the LeafWiki web UI
  # can be iframed cross-origin from Helm's origin and keep its session
  # cookie — see CLAUDE.md "helm_tls_proxy.py cookie-rewriting pattern".
  # Reuses the helm image (COPY . . already bakes in helm_tls_proxy.py;
  # stdlib-only, no extra deps) rather than a separate Dockerfile, and reuses
  # Helm's own cert.pem/key.pem from ./data rather than managing a second
  # cert.
  leafwiki-proxy:
    build:
      context: .
      dockerfile: Dockerfile.helm
    container_name: leafwiki-proxy
    restart: unless-stopped
    depends_on:
      - leafwiki
    ports:
      - "${LEAFWIKI_PROXY_PORT:-${HELM_BIND:-127.0.0.1}:9004:9004}"
    volumes:
      - ./data:/app/state
    environment:
      HELM_TLS_CERT: "/app/state/cert.pem"
      HELM_TLS_KEY: "/app/state/key.pem"
      # frame-ancestors needs an EXACT scheme+host+port match against what
      # the browser used to load Helm itself — see helm_tls_proxy.py's own
      # note on this. Defaults to the same SERVER_HOST as the helm service,
      # on helm's published port (8443).
      HELM_FRAME_ORIGINS: "${LEAFWIKI_FRAME_ORIGINS:-https://${SERVER_HOST:-localhost}:8443}"
    command: ["python3", "helm_tls_proxy.py", "9004", "8080", "leafwiki"]

  # ── SearXNG metasearch engine (powering the Search widget) ──────────────────
  # The frontend populates the Searx engine URL dynamically from /api/config,
  # which pulls SEARXNG_URL from the helm service's environment (set above).
  # The browser hits SearXNG directly, so it binds the same interface as helm
  # (HELM_BIND). If you set SEARXNG_HOST to a real address, browsers off-host
  # can use the Search widget; left as "localhost" it only works on-host.
  searxng:
    image: searxng/searxng:latest
    container_name: searxng-core
    restart: unless-stopped
    ports:
      - "${SEARXNG_PORT:-${HELM_BIND:-127.0.0.1}:8081:8080}"
    volumes:
      - ./searxng-settings:/etc/searxng
      - ./searxng-data:/var/lib/searxng
    environment:
      - "BASE_URL=http://${SEARXNG_HOST:-localhost}:8081/"
      - "SECRET_KEY=${SEARXNG_SECRET_KEY:-changeme}"

  # NOTE: the Backup Pipeline tab no longer needs a service here. The external
  # backup scripts call emit_event.py, which POSTs each event straight to
  # helm_server.py's token-authed POST /api/backup-events. There used to be a
  # rabbitmq broker + a backup-worker drainer container; both are gone.

# ── Network: all containers on an isolated bridge so they can reach each other
# by service name. The host (and LAN browsers) reach helm on published ports.
networks:
  default:
    name: helm-net
    driver: bridge
